name: Notificações Web

on:
  workflow_dispatch:
    inputs:
      send_test:
        description: Enviar um teste apontando para o jogo mais próximo
        required: true
        default: false
        type: boolean
  schedule:
    # O GitHub pode atrasar execuções agendadas; quinze minutos é o intervalo
    # nominal e substitui funções cobradas do Firebase.
    - cron: '*/15 * * * *'

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BANCO_DE_DADOS_SELETOR_TIMES }}
      - name: Enviar avisos de jogos
        env:
          FIREBASE_PROJECT_ID: banco-de-dados-seletor-times
          # Execuções agendadas sempre usam false. O teste só ocorre quando uma
          # pessoa marca explicitamente a opção na execução manual.
          WEB_PUSH_TEST: ${{ inputs.send_test && 'true' || 'false' }}
        run: node scripts/send-web-notifications.mjs
