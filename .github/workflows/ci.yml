name: Qualidade

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      # A mesma combinação local: Node 22 para Quasar/Firebase e Java 21 para os emuladores.
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependências
        run: npm ci
      - name: Revisar código
        run: npm run lint
      - name: Conferir tipos
        run: npm run typecheck
      - name: Testar domínio
        run: npm test
      - name: Testar regras do Firestore
        run: npm run test:rules
      - name: Compilar PWA
        run: npm run build:pwa
      - name: Validar funções de notificação
        working-directory: functions
        run: npm ci && npm run check

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      # O fluxo administrativo chama funções locais; suas dependências ficam
      # em um pacote separado e também precisam existir no executor limpo.
      - run: npm ci --prefix functions
      - run: npx playwright install --with-deps chromium
      - name: Testar os fluxos no navegador
        run: npm run test:e2e
