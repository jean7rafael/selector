name: Aplicativo Android

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      # O GitHub reproduz as mesmas versões usadas no Mac para que o pacote
      # não dependa de ferramentas instaladas somente na máquina do autor.
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3

      - name: Instalar dependências da interface
        run: npm ci
      - name: Instalar dependências nativas
        working-directory: src-capacitor
        run: npm ci
      - name: Gerar APK de testes
        run: npm run build:android:apk

      # A chave automática de debug torna este APK instalável para testes.
      # Uma publicação na Play Store continuará usando uma chave privada própria.
      - uses: actions/upload-artifact@v4
        with:
          name: volei-hub-android
          path: src-capacitor/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
