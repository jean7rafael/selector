name: Publicar produção Web

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    # A branch main representa a versão pública e estável do Vôlei Hub.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Compilar PWA de produção
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.STAGE_FIREBASE_PROJECT_ID }}
          FIREBASE_APP_ID: ${{ secrets.STAGE_FIREBASE_APP_ID }}
          FIREBASE_API_KEY: ${{ secrets.STAGE_FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.STAGE_FIREBASE_AUTH_DOMAIN }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.STAGE_FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_VAPID_KEY: ${{ secrets.STAGE_FIREBASE_VAPID_KEY }}
        run: npm run build:pwa
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BANCO_DE_DADOS_SELETOR_TIMES }}
          channelId: live
          projectId: banco-de-dados-seletor-times
      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BANCO_DE_DADOS_SELETOR_TIMES }}
      - name: Publicar regras e índices
        run: npx firebase deploy --project banco-de-dados-seletor-times --only firestore:rules,firestore:indexes
